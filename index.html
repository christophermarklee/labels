<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labels</title>
<style>
  :root { color-scheme:light; font:16px system-ui,sans-serif; color:#24312b; background:#f3f4ef; }
  * { box-sizing:border-box; } body { margin:0; } main { max-width:960px; margin:64px auto; padding:0 24px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:32px; gap:16px; }
  h1 { font-size:32px; letter-spacing:-1px; margin:0; } header span,.hint { color:#637067; font-size:14px; }
  .layout { display:grid; grid-template-columns:1fr 1fr; gap:32px; }
  label { display:block; font-size:14px; font-weight:600; margin-bottom:8px; }
  textarea,select,input,button { font:inherit; border:1px solid #cbd1c6; border-radius:8px; padding:11px; }
  textarea,select,input { width:100%; background:#fff; color:inherit; } textarea { min-height:156px; resize:vertical; line-height:1.5; }
  :focus-visible { outline:3px solid #98bca1; outline-offset:2px; }
  .row { display:flex; gap:16px; margin:20px 0; } .row>div { flex:1; min-width:0; }
  .hint { line-height:1.5; margin:8px 0 20px; } button { cursor:pointer; background:#fff; }
  button:disabled { opacity:.45; cursor:default; } #print { background:#24593a; color:white; border-color:#24593a; padding:13px 24px; font-weight:600; }
  .preview { background:#e5e9df; border-radius:12px; padding:32px; min-height:280px; display:flex; align-items:center; justify-content:center; }
  .preview img { width:100%; height:auto; box-shadow:0 6px 18px #20302518; border-radius:3px; }
  .preview img[hidden] { display:none; } .caption { font-size:13px; color:#637067; margin:12px 0; }
  #status { min-height:48px; line-height:1.5; font-size:14px; } .error { color:#a33424; }
  .actions { display:flex; align-items:center; gap:12px; } #refresh { font-size:13px; padding:8px; }
  @media(max-width:650px) { main { margin-top:28px; } .layout { grid-template-columns:1fr; gap:20px; } header { flex-wrap:wrap; } }
</style>
<main>
  <header><h1>Labels<span style="color:#438456">.</span></h1><span>Brother QL-810W</span></header>
  <div class="layout">
    <section aria-label="Label editor">
      <label for="text">Label text</label>
      <textarea id="text" maxlength="800" spellcheck="false">Hello, world.</textarea>
      <p class="hint">Enter for a new line. Text shrinks to fit.</p>
      <label for="size">Label roll / size</label>
      <select id="size">
        <option value="62red">62 mm black/red roll · 100 mm long</option>
        <option value="62X1">62 mm continuous · 100 mm long</option>
        <option value="29X1">29 mm continuous · 100 mm long</option>
        <option value="29x90">29 × 90 mm · die-cut</option>
        <option value="62x100">62 × 100 mm · die-cut</option>
      </select>
      <p class="hint">Match the roll loaded in your printer.</p>
      <div class="row">
        <div><label for="align">Alignment</label><select id="align"><option value="center">Center</option><option value="left">Left</option></select></div>
        <div><label for="font_size">Text size (pt)</label><input id="font_size" type="number" min="8" max="72" value="24"></div>
      </div>
      <div class="row">
        <div style="flex:3"><label for="printer">Printer</label><select id="printer"><option value="">Loading…</option></select></div>
        <div><label for="copies">Copies</label><input id="copies" type="number" min="1" max="20" value="1"></div>
      </div>
      <div class="actions"><button id="print" disabled>Print label</button><button id="refresh">Refresh printers</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section aria-label="Label preview">
      <div class="preview"><img id="preview" alt="Your label preview" hidden><span id="placeholder">Preparing preview…</span></div>
      <p class="caption">300 dpi · black on white · preview enlarged to fit</p>
      <p id="preview-status" class="hint" role="status"></p>
    </section>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  let timer, sequence=0, imageURL, valid=false, printing=false;
  const payload=()=>({text:$('text').value,size:$('size').value,align:$('align').value,font_size:Number($('font_size').value)});
  const updateButton=()=> $('print').disabled=printing || !valid || !$('printer').value || !$('copies').checkValidity();
  function status(message,error=false) { $('status').textContent=message; $('status').className=error?'error':''; }
  async function checked(response) {
    if(!response.ok) {
      const data=await response.json();
      throw new Error(typeof data.detail==='string' ? data.detail : data.detail?.[0]?.msg || 'Request failed.');
    }
    return response;
  }
  function schedulePreview() {
    valid=false; updateButton(); clearTimeout(timer);
    const current=++sequence;
    $('preview-status').textContent='Updating preview…';
    timer=setTimeout(async()=>{
      try {
        const response=await checked(await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}));
        const blob=await response.blob();
        if(current!==sequence) return;
        if(imageURL) URL.revokeObjectURL(imageURL);
        imageURL=URL.createObjectURL(blob); $('preview').src=imageURL;
        $('preview').hidden=false; $('placeholder').hidden=true;
        $('preview-status').textContent=''; valid=true;
      } catch(error) {
        if(current!==sequence) return;
        $('preview').hidden=true; $('placeholder').hidden=false; $('placeholder').textContent='No preview';
        $('preview-status').textContent=error.message;
      }
      updateButton();
    },200);
  }
  async function loadPrinters() {
    $('refresh').disabled=true;
    try {
      const data=await (await checked(await fetch('/api/printers'))).json();
      const previous=$('printer').value;
      $('printer').replaceChildren(...data.printers.map(name=>new Option(name,name)));
      if(data.printers.includes(previous)) $('printer').value=previous;
      else $('printer').value=data.printers.find(name=>/ql.?810/i.test(name))||data.printers[0]||'';
      if(!data.printers.length) {
        $('printer').add(new Option('No printers configured',''));
        status('Add the Brother printer in CUPS, then refresh printers.',true);
      } else status('Ready.');
    } catch(error) { $('printer').replaceChildren(new Option('Printer unavailable','')); status(error.message,true); }
    $('refresh').disabled=false; updateButton();
  }
  for(const id of ['text','size','align','font_size']) $(id).addEventListener('input',schedulePreview);
  $('printer').addEventListener('change',updateButton); $('copies').addEventListener('input',updateButton);
  $('refresh').addEventListener('click',loadPrinters);
  $('print').addEventListener('click',async()=>{
    printing=true; updateButton(); status('Sending label…');
    try {
      const response=await checked(await fetch('/api/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload(),printer:$('printer').value,copies:Number($('copies').value)})}));
      const data=await response.json(); status(data.job_id ? `Queued as ${data.job_id}.` : data.message);
    } catch(error) { status(error.message,true); }
    printing=false; updateButton();
  });
  schedulePreview(); loadPrinters();
</script>
</html>
